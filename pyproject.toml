[project]
name = "bist-ai-radar"
version = "0.1.0"
description = "Public BIST research reports served through a Telegram webhook"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
