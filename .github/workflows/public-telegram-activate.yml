name: Connect public Telegram bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-telegram-production
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and connect Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          PUBLIC_BOT_WORKER_URL: ${{ vars.PUBLIC_BOT_WORKER_URL }}
        run: python src/bist_ai_radar/public_worker_register.py
